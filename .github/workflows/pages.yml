name: Build and publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build website
        run: node scripts/build.mjs
        env:
          SITE_URL: https://sujanguragain.com.np
      - name: Check pages and content
        run: node scripts/check.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Check out deployment helper
        uses: actions/checkout@v6
      - name: Coordinate with existing branch-based publishing
        run: node scripts/wait-for-pages.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
